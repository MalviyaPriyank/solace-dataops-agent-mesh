log:
  stdout_log_level: INFO
  log_file_level: DEBUG
  log_file: gyrus_webui_gateway.log

!include shared_config.yaml

apps:
  - name: gyrus_webui_gateway_app
    app_base_path: .
    app_module: solace_agent_mesh.gateway.http_sse.app
    broker:
      <<: *broker_connection

    app_config:
      namespace: ${NAMESPACE, local/gyrus-demo}
      session_secret_key: "${SESSION_SECRET_KEY, local-demo-session-secret}"
      artifact_service: *default_artifact_service
      session_service:
        type: "sql"
        database_url: "${WEB_UI_GATEWAY_DATABASE_URL, sqlite:///gyrus-webui-gateway.db}"
        default_behavior: "PERSISTENT"

      platform_service:
        url: "${PLATFORM_SERVICE_URL, http://localhost:8001}"

      external_auth_service_url: ${EXTERNAL_AUTH_SERVICE_URL, }
      external_auth_provider: ${EXTERNAL_AUTH_PROVIDER, generic}
      frontend_use_authorization: ${FRONTEND_USE_AUTHORIZATION, false}

      model: *general_model
      model_provider:
        - "general"
      gateway_id: ${WEBUI_GATEWAY_ID, gyrus-local-webui}
      fastapi_host: ${FASTAPI_HOST, 127.0.0.1}
      fastapi_port: ${FASTAPI_PORT, 8000}
      cors_allowed_origins:
        - "http://localhost:3000"
        - "http://127.0.0.1:3000"

      enable_embed_resolution: ${ENABLE_EMBED_RESOLUTION, true}
      gateway_artifact_content_limit_bytes: ${GATEWAY_ARTIFACT_LIMIT_BYTES, 10000000}
      sse_max_queue_size: ${SSE_MAX_QUEUE_SIZE, 200}
      visualization_queue_size: ${VISUALIZATION_QUEUE_SIZE, 600}
      task_logger_queue_size: ${TASK_LOGGER_QUEUE_SIZE, 600}

      system_purpose: >
        The system is a local DataOps incident response demo. It uses Solace
        Agent Mesh to coordinate tasks and proxies the local Gyrus ADK agent
        through the A2A protocol.

      response_format: >
        Return clear Markdown. Prefer concise incident-report sections with
        evidence, verification steps, and safe next actions.

      frontend_welcome_message: ${FRONTEND_WELCOME_MESSAGE, Ask the DataOps Incident Orchestrator about a checkout data incident.}
      frontend_bot_name: ${FRONTEND_BOT_NAME, Gyrus on Solace Agent Mesh}
      frontend_collect_feedback: false
      frontend_logo_url: "${WEBUI_FRONTEND_LOGO_URL, }"

      task_logging:
        enabled: true
        hybrid_buffer:
          enabled: false
        log_status_updates: true
        log_artifact_events: true
        log_file_parts: true
        max_file_part_size_bytes: 10240

      feedback_publishing:
        enabled: false
        topic: "${NAMESPACE, local/gyrus-demo}/sam/feedback/v1"
        include_task_info: "summary"
        max_payload_size_bytes: 9000000

      frontend_feature_enablement:
        background_tasks: ${BACKGROUND_TASKS_ENABLED, false}
        artifactsPage: ${ARTIFACTS_PAGE_ENABLED, false}
